<!doctype html>
<html>
<head><meta charset="utf-8"><title>Fake Meet</title></head>
<body>
  <div id="prejoin">
    <input id="name" placeholder="Your name" />
    <button id="join">Ask to join</button>
    <button id="switch" style="display:none">Switch here</button>
  </div>
  <div id="incall" style="display:none">
    <!-- One tile per participant (incl. the bot), like Meet's grid. -->
    <div id="tiles">
      <div data-participant-id="self"></div>
      <div data-participant-id="p1"></div>
    </div>
    <!-- People panel: opened by clicking #people; one .prow per participant,
         with the name in .pname and a .speaking child present while talking. -->
    <button id="people">People</button>
    <div id="panel" style="display:none"></div>
    <div id="removed" style="display:none">You've been removed from the meeting</div>
    <button id="leave">Leave call</button>
  </div>
  <script>
    document.getElementById('join').addEventListener('click', () => {
      setTimeout(() => {
        document.getElementById('prejoin').style.display = 'none';
        document.getElementById('incall').style.display = 'block';
      }, 300);
    });
    // ?switchHere=1 — the account is already in the call elsewhere, so Meet
    // offers "Switch here" instead of a join button.
    if (new URLSearchParams(location.search).get('switchHere')) {
      document.getElementById('join').style.display = 'none';
      document.getElementById('switch').style.display = '';
    }
    // ?joinDelay=N — pre-join UI renders slowly, like real Meet on cold loads.
    const joinDelay = Number(new URLSearchParams(location.search).get('joinDelay') || 0);
    if (joinDelay > 0) {
      const btn = document.getElementById('join');
      btn.style.display = 'none';
      setTimeout(() => { btn.style.display = ''; }, joinDelay);
    }
    // Open the People panel.
    document.getElementById('people').addEventListener('click', () => {
      document.getElementById('panel').style.display = 'block';
    });
    // Test hooks
    window.__setCount = (n) => {
      const tiles = document.getElementById('tiles');
      tiles.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const t = document.createElement('div');
        t.setAttribute('data-participant-id', i === 0 ? 'self' : 'p' + i);
        tiles.appendChild(t);
      }
    };
    window.__remove = () => { document.getElementById('removed').style.display = 'block'; };
    // Render a realistic NOISY Meet video tile: the data-participant-id
    // container holds Material-icon ligatures (keep_outline, mic_none,
    // more_vert, devices) and per-participant action buttons whose aria-label
    // embeds the name, plus the bare name shown twice — exactly the soup that
    // made nameOf return a blob. Used to verify clean name extraction.
    window.__setNoisyTile = (id, name) => {
      const tiles = document.getElementById('tiles');
      const tile = document.createElement('div');
      tile.setAttribute('data-participant-id', id);
      const icon = (lig) => { const s = document.createElement('span'); s.className = 'google-symbols'; s.textContent = lig; return s; };
      const ctrl = (label) => { const b = document.createElement('button'); b.setAttribute('aria-label', label); b.appendChild(icon('placeholder')); return b; };
      tile.appendChild(icon('keep_outline'));
      tile.appendChild(ctrl('Pin ' + name + ' to your main screen'));
      tile.appendChild(icon('mic_none'));
      tile.appendChild(ctrl('Mute ' + name));
      tile.appendChild(icon('more_vert'));
      tile.appendChild(ctrl('More options for ' + name));
      const n1 = document.createElement('span'); n1.textContent = name; tile.appendChild(n1);
      const n2 = document.createElement('span'); n2.textContent = name; tile.appendChild(n2);
      tile.appendChild(icon('devices'));
      tiles.appendChild(tile);
    };
    // Render the People panel like Meet: one row per participant, each
    // carrying a data-participant-id + aria-label name (what the in-page probe
    // auto-discovers). The bot's own row uses id "self".
    window.__setRoster = (names) => {
      const panel = document.getElementById('panel');
      panel.innerHTML = '';
      names.forEach((name, i) => {
        const row = document.createElement('div');
        row.setAttribute('data-participant-id', i === 0 ? 'self' : 'p_' + name.replace(/\s+/g, '_'));
        row.setAttribute('aria-label', name);
        row.textContent = name;
        panel.appendChild(row);
      });
    };
    // Mark names as currently speaking via an explicit indicator child whose
    // class contains "speaking" (one of the markers the probe recognizes).
    window.__setSpeaking = (names) => {
      const set = new Set(names);
      for (const row of document.querySelectorAll('#panel [data-participant-id]')) {
        const name = row.getAttribute('aria-label');
        const existing = row.querySelector('.speaking-indicator');
        if (set.has(name) && !existing) {
          const s = document.createElement('span');
          s.className = 'speaking-indicator';
          row.appendChild(s);
        } else if (!set.has(name) && existing) {
          existing.remove();
        }
      }
    };
  </script>
</body>
</html>
